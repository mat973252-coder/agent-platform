name: verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: ./mvnw -B -ntp verify
      - name: Validate local deployment
        run: docker compose config --quiet
      - name: Start PostgreSQL-backed Temporal
        run: docker compose up -d --wait --wait-timeout 180
      - name: Verify API and Worker crash recovery
        run: python3 scripts/smoke.py
      - name: Collect container logs
        if: failure()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-evidence
          path: |
            **/target/surefire-reports/
            var/smoke.log
            compose.log
      - name: Stop test containers
        if: always()
        run: docker compose down
