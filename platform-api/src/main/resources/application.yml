spring:
  application:
    name: agent-platform
  datasource:
    url: jdbc:postgresql://127.0.0.1:5434/agent_platform
    username: agent_platform
    password: ${PLATFORM_DATABASE_PASSWORD:}
server:
  address: 127.0.0.1
  port: 9090
platform:
  model:
    provider: ${PLATFORM_MODEL_PROVIDER:OFFLINE}
    base-url: ${PLATFORM_MODEL_BASE_URL:}
    name: ${PLATFORM_MODEL_NAME:}
    api-key: ${PLATFORM_MODEL_API_KEY:}
    pricing-version: ${PLATFORM_MODEL_PRICING_VERSION:}
    input-microusd-per-million: ${PLATFORM_MODEL_INPUT_MICROUSD_PER_MILLION:0}
    output-microusd-per-million: ${PLATFORM_MODEL_OUTPUT_MICROUSD_PER_MILLION:0}
    max-input-tokens: 8192
    max-output-tokens: 512
  budget:
    max-model-steps: 6
    max-duration-seconds: 900
    max-tokens: 100000
    max-cost-microusd: 1000000
  security:
    operator-password: ${PLATFORM_OPERATOR_PASSWORD:}
    approver-password: ${PLATFORM_APPROVER_PASSWORD:}
  temporal:
    target: 127.0.0.1:7233
    namespace: default
    task-queue: agent-platform-diagnostics
management:
  endpoints:
    web:
      exposure:
        include: health,info
